name: MultiFX build, test and direct Releases
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
    inputs:
      upload_diagnostics:
        description: Upload sanitized auxiliary diagnostics (optional; 1 day)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  release-windows:
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    uses: ./.github/workflows/platform.yml
    with:
      platform: windows
      publish: true
      upload_diagnostics: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_diagnostics }}
  release-arm64:
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    uses: ./.github/workflows/platform.yml
    with:
      platform: arm64
      publish: true
      upload_diagnostics: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_diagnostics }}
  validate-pull-request:
    if: github.event_name == 'pull_request'
    strategy:
      matrix:
        platform: [windows, arm64]
    permissions:
      contents: read
    uses: ./.github/workflows/platform.yml
    with:
      platform: ${{ matrix.platform }}
      publish: false
      upload_diagnostics: false
