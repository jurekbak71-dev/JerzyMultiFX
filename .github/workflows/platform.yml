name: MultiFX platform build and publication
on:
  workflow_call:
    inputs:
      platform:
        type: string
        required: true
      publish:
        type: boolean
        default: false
      upload_diagnostics:
        type: boolean
        default: false
# Inherits the caller's contents:read (PR) or contents:write (trusted release job).
# No secrets:inherit: only the standard, job-scoped GITHUB_TOKEN is needed.
jobs:
  build-test-release:
    name: ${{ inputs.platform }} build, test and release
    runs-on: ${{ inputs.platform == 'windows' && 'windows-2025' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate platform
        shell: bash
        env:
          PLATFORM: ${{ inputs.platform }}
        run: test "$PLATFORM" = windows || test "$PLATFORM" = arm64
      - name: Pinned Steinberg SDK
        if: inputs.platform == 'windows'
        shell: pwsh
        run: |
          git clone --no-checkout https://github.com/steinbergmedia/vst3sdk.git "$env:RUNNER_TEMP/vst3sdk"
          git -C "$env:RUNNER_TEMP/vst3sdk" checkout --detach 3cdf9ca5d1f5b1b21e0a86832aa4abe55607bd96
          git -C "$env:RUNNER_TEMP/vst3sdk" submodule update --init --recursive
      - name: Build native Windows x64
        if: inputs.platform == 'windows'
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 -DMULTIFX_VST3=ON -DVST3_SDK_ROOT="$env:RUNNER_TEMP/vst3sdk"
          if ($LASTEXITCODE) { throw 'Configure failed' }
          cmake --build build --config Release --parallel 3
          if ($LASTEXITCODE) { throw 'Build failed' }
      - name: DSP and real editor smoke test
        if: inputs.platform == 'windows'
        shell: pwsh
        run: |
          ctest --test-dir build -C Release --output-on-failure --no-tests=error
          if ($LASTEXITCODE) { throw 'DSP tests failed' }
          $dll = Get-ChildItem build -Recurse -File -Filter JerzyMultiFX.vst3 | Select-Object -First 1
          $test = Get-ChildItem build -Recurse -File -Filter editor_smoke.exe | Select-Object -First 1
          & $test.FullName $dll.FullName "$pwd/build/editor.bmp"
          if ($LASTEXITCODE) { throw 'GUI test failed' }
          $signal = Get-ChildItem build -Recurse -File -Filter plugin_signal.exe | Select-Object -First 1
          & $signal.FullName $dll.FullName "$pwd/build/ir-signal-test.wav"
          if ($LASTEXITCODE) { throw 'Actual VST3 audio and latency regression failed' }
          $bench = Get-ChildItem build -Recurse -File -Filter dsp_benchmark.exe | Select-Object -First 1
          & $bench.FullName "$pwd/build/performance.json"
          if ($LASTEXITCODE) { throw 'DSP benchmark failed' }
          $parseErrors = $null
          $parseTokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$pwd/scripts/install-vst3.ps1", [ref]$parseTokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { throw 'Windows installer syntax error' }
          cmd /c scripts\install-vst3.cmd --help
          if ($LASTEXITCODE) { throw 'VST installer command syntax error' }
          cmd /c scripts\install-from-windows.cmd --help
          if ($LASTEXITCODE) { throw 'RPi installer command syntax error' }
      - name: Toolchain and dummy JACK
        if: inputs.platform == 'arm64'
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build g++ pkg-config libjack-jackd2-dev jackd2
      - name: Build native ARM64 and test shared DSP
        if: inputs.platform == 'arm64'
        shell: bash
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS_RELEASE=-O2
          cmake --build build --parallel 3
          ctest --test-dir build --output-on-failure --no-tests=error
          build/dsp_benchmark build/performance.json
      - name: Core HTTP, BLE and LCD logic
        if: inputs.platform == 'arm64'
        shell: bash
        run: |
          mkdir -p .build
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          MULTIFX_BINARY="$PWD/build/jerzy-multifx" python3 tests/integration.py
      - name: Actual JACK signal and MIDI
        if: inputs.platform == 'arm64'
        shell: bash
        run: |
          mkdir -p .build/native
          ln -s "$PWD/build/jerzy-multifx" .build/native/jerzy-multifx
          g++ -std=c++20 tests/JackProbe.cpp -o .build/native/jack_probe $(pkg-config --cflags --libs jack)
          python3 tests/audio_integration.py
      - name: Package actual VST3 bundle and verify validator
        if: inputs.platform == 'windows'
        shell: pwsh
        run: python scripts/package.py windows --build build --sdk "${{ runner.temp }}/vst3sdk"
      - name: Package real AArch64 binary
        if: inputs.platform == 'arm64'
        shell: bash
        run: |
          python3 scripts/package.py arm64 --build build
          version=$(cat VERSION)
          python3 scripts/make_headrush_installer.py --package "dist/JerzyMultiFX-RPi-aarch64-v${version}.tar.gz" --checksums dist/SHA256SUMS
      - name: Verify packages and privacy allowlist
        shell: bash
        run: python scripts/verify_packages.py
      - name: Publish this job's files directly to GitHub Release
        if: inputs.publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PLATFORM: ${{ inputs.platform }}
        run: python scripts/publish_release.py --platform "$RELEASE_PLATFORM"
      - name: Sanitized diagnostic summary
        if: always()
        shell: bash
        env:
          RESULT: ${{ job.status }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          mkdir -p .build/public-diagnostics
          printf 'Platform: %s\nJob result: %s\nSee the Actions run for detailed logs.\n' "$PLATFORM" "$RESULT" > .build/public-diagnostics/summary.txt
      - name: Optional auxiliary diagnostics (one day)
        if: always() && inputs.upload_diagnostics
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ inputs.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build/public-diagnostics/summary.txt
          retention-days: 1
          if-no-files-found: error
